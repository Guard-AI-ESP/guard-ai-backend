[package]
name = "guard-ai-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["serde", "v4"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
chrono = "0.4"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

thiserror = "1.0"

# Random pour simulation
rand = "0.8"

# Async streams pour WebSocket
futures-util = "0.3"

# SQLx avec support SQLite
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "uuid",
    "json",
    "migrate",
] }

[dev-dependencies]
glob = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
